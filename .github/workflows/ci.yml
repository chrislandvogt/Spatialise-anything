name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest
      - name: Corpus expected outputs validate (phase 1 exit)
        run: |
          for f in corpus/items/*/expected.geojson; do
            python skills/spatialise-anything/scripts/validate_features.py "$f"
          done
      - name: Scripts-only tier 0 baseline
        run: |
          python eval/run_scripted.py --out runs/scripted
          python eval/score.py --outputs runs/scripted --offline \
            --only t0-coords-mixed t0-datums t0-photos t1-assets none-traps
      - name: Skill scripts run on the standard library alone
        run: |
          python -m venv /tmp/bare && /tmp/bare/bin/python -I - <<'PY'
          import subprocess, sys
          s = "skills/spatialise-anything/scripts"
          for cmd in [
              [f"{s}/parse_coords.py", "--text", "GPS -37.2471, 144.4529", "--frame", "AU"],
              [f"{s}/gazetteer.py", "search", "Golden Square"],
              [f"{s}/build_geometry.py", "offset", "--from", "144.2,-37.0", "--bearing", "SE", "--distance", "5 km"],
              [f"{s}/read_exif.py", "corpus/items/t0-photos/IMG_0001.jpg"],
              [f"{s}/sniff_table.py", "corpus/items/t1-assets/assets.csv"],
          ]:
              subprocess.run([sys.executable, "-I", *cmd], check=True, stdout=subprocess.DEVNULL)
          print("stdlib-only OK")
          PY
      - name: Package
        run: python tools/package.py

  server:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e "server[dev]"
      - name: Vendored contract is in sync with the skill
        run: python tools/sync_contract.py --check
      - name: Server tests (in-process ArcGIS stand-in, no network)
        run: python -m pytest server/tests
      - name: Example config loads and the CLI starts
        run: |
          spatialise-mcp --version
          python -c "from spatialise_mcp import config; c = config.load('server/config.example.toml', {}); print(len(c.boundaries), 'boundary sets')"

  server-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t spatialise-mcp server/
      - name: Container starts, is healthy and runs unprivileged
        run: |
          docker run -d --name s -p 8000:8000 spatialise-mcp
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/healthz && break || sleep 1; done
          curl -sf http://127.0.0.1:8000/healthz
          test "$(docker exec s id -u)" = "10001"

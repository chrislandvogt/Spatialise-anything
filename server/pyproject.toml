[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spatialise-mcp"
version = "0.2.0"
description = "MCP server for Spatialise Anything: resolves places through ArcGIS locators and feature services, and publishes contract features to hosted feature layers."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "mcp>=2.3,<3",
  "httpx>=0.27",
  "uvicorn>=0.30",
  "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8", "anyio>=4"]

[project.scripts]
spatialise-mcp = "spatialise_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["spatialise_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
